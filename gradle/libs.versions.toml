[versions]
kotlin = "2.4.20-RC"
coroutines = "1.11.0"
kotlinx-browser = "0.5.0"
xmlutil = "1.0.2"
imageio-webp = "3.14.0"
ktlint = "14.2.0"
vanniktech-publish = "0.37.0"
node-gradle = "7.1.0"
fit-kotlin-sdk = "21.205.1"
picocli = "4.7.7"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }
xmlutil-serialization = { module = "io.github.pdvrieze.xmlutil:serialization", version.ref = "xmlutil" }
imageio-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "imageio-webp" }
fit-kotlin-sdk = { module = "io.github.glandais:fit-kotlin-sdk", version.ref = "fit-kotlin-sdk" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
