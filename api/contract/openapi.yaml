          type: number
          description: Kilometres read from a tile source the catalogue does not know.
        noDataKm:
          type: number
          description: Kilometres where no source had data, read as 0 m.
        fallbackAfterErrorKm:
          type: number
          description: Of the above, kilometres read from a fallback because a tile
