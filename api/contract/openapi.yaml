      - ignLidarHdKm
      - mapterhornMeasuredKm
      - mapterhornKm
      - otherKm
      - noDataKm
      - fallbackAfterErrorKm
      - failedTiles
      properties:
        ignLidarHdKm:
          type: number
          description: Kilometres read from IGN LiDAR HD.
        mapterhornMeasuredKm:
          type: number
          description: Kilometres read from Mapterhorn in France, where it is LiDAR-derived
            and measured.
        mapterhornKm:
          type: number
          description: 'Kilometres read from Mapterhorn elsewhere: a national model
