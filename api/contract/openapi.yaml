        in: query
        description: When the XML does not parse, repair it (BOM, control characters,
          bare `&`, split surrogate references) and parse again; each repair is reported
          in `warnings`. Default `true`.
        schema:
          type: boolean
          default: true
      requestBody:
        description: The GPX, as a multipart upload (part `gpx`) or as the raw body.
          Options travel in the multipart part `request`; a raw body takes every default.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - gpx
              properties:
                gpx:
                  type: string
                  description: The GPX document
                  format: binary
                request:
                  $ref: "#/components/schemas/TileMapRequest"
            encoding:
              gpx:
                contentType: application/gpx+xml
              request:
                contentType: application/json
          application/gpx+xml:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: string
              format: binary
          text/xml:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: The map, a PNG
          headers:
            Content-Disposition:
              description: '`inline; filename="<name>.png"`'
              required: false
              deprecated: false
              schema:
                type: string
            X-Vcyclist-Missing-Tiles:
              description: '`<missing>/<total>`: background tiles the tile server
                did not give, painted grey. Absent when every tile was drawn.'
              required: false
              deprecated: false
              schema:
