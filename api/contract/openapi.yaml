openapi: 3.1.1
info:
  title: vcyclist API
  version: 1.0.0
  description: 'HTTP door of the vcyclist engine, a physics-based cycling simulator
    that turns GPS traces into physics-aware virtualized rides. Stateless: every request
    carries its own GPX. Errors are RFC 9457 `application/problem+json` documents.
    This document is generated from the server''s routing tree (`./gradlew :api:generateOpenApi`).'
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
      - meta
      summary: Liveness probe
      description: Answers `{"status":"UP"}` while the server accepts requests. Computes
        nothing.
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/version:
    get:
      operationId: getVersion
      tags:
      - meta
      summary: Contract and engine versions
      description: '`apiVersion` is the version of this contract, which changes only
        when the contract does; `engineVersion` is the version of the vcyclist engine
        the server was built with.'
      responses:
        "200":
          description: The versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/catalog:
    get:
      operationId: getCatalog
      tags:
      - meta
      summary: Wire values of every enumeration
      description: The accepted spellings of every enumerated option — power models,
        road conditions, racing-line corridors, elevation-gain presets, GPX power
        sources, DEM sources — and the corner kinds and output formats the API emits.
        Read from the engine, never restated.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/fields:
    get:
      operationId: listFields
      tags:
      - meta
      summary: Per-point fields of a track
      description: Every per-point field a track carries, in ordinal order, with its
        unit and category. `prop` is the name the CSV and JSON-columns exports accept
        in their `fields` option.
      responses:
        "200":
          description: The field definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldDefinition"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/gpx/parse:
    post:
      operationId: parseGpx
      tags:
      - gpx
      summary: Parse a GPX
      description: 'Reads a GPX document and returns its waypoints and, for each selected
        path, its name, its container and its statistics — optionally every point.
        Simulates nothing: distances and elevations are those of the file.'
      parameters:
      - name: kinds
        in: query
        description: 'Which containers to read: `all` (`<trk>` and `<rte>`), `tracks`
          (`<trk>` only), `routes` (`<rte>` only). Default `all`.'
        schema:
          type: string
          default: all
          enum:
          - all
          - tracks
          - routes
      - name: split
        in: query
        description: '`tracks`: one path per `<trk>` / `<rte>`, segments concatenated
          (the gap between two segments counts as distance). `segments`: one path
          per `<trkseg>`. Default `tracks`.'
        schema:
          type: string
          default: tracks
          enum:
          - tracks
          - segments
      - name: trackIndex
        in: query
        description: 'Keep only the path at this index of the selection (after `kinds`
          and `split`, empty paths dropped). Absent: every path. Out of range: 422
          `track-index-out-of-range`.'
        schema:
          type: integer
          minimum: 0.0
      - name: repair
        in: query
        description: When the XML does not parse, repair it (BOM, control characters,
          bare `&`, split surrogate references) and parse again; each repair is reported
          in `warnings`. Default `true`.
        schema:
          type: boolean
          default: true
      - name: points
        in: query
        description: Include every point of each path. Default `false`.
        schema:
          type: boolean
          default: false
      requestBody:
        description: The GPX, as a multipart upload (part `gpx`) or as the raw body.
          This operation takes no `request` part.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - gpx
              properties:
                gpx:
                  type: string
                  description: The GPX document
                  format: binary
            encoding:
              gpx:
                contentType: application/gpx+xml
          application/gpx+xml:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: string
              format: binary
          text/xml:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: The parsed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedGpx"
        "400":
          description: 'Problem: `urn:vcyclist:problem:invalid-body`, `urn:vcyclist:problem:unknown-key`,
            `urn:vcyclist:problem:invalid-option`, `urn:vcyclist:problem:invalid-gpx`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: 'Problem: `urn:vcyclist:problem:payload-too-large`, `urn:vcyclist:problem:too-many-points`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: 'Problem: `urn:vcyclist:problem:unsupported-media-type`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 'Problem: `urn:vcyclist:problem:empty-gpx`, `urn:vcyclist:problem:track-index-out-of-range`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 'Problem: `urn:vcyclist:problem:timeout`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/enhance:
    post:
      operationId: enhance
      tags:
      - enhance
      summary: Simulate a ride on a GPX
      description: 'Runs the vcyclist pipeline — densify, optional DEM elevations,
        smoothing, curvature or racing line, cornering and braking limits, the time-stepping
        physics simulation, then the optional 1 Hz resample, W'' balance and simplification
        — on each selected path, with the rider, bike, wind and power strategy of
        the `request` part. Every absent option takes the default published by `GET
        /api/v1/defaults`. Unknown keys and invalid values are rejected before any
        computation. The answer is a JSON summary, or the enhanced paths as GPX, FIT,
        CSV or column JSON (`format`, or `Accept`); a file format carries no `warnings`.
        Each summary track reports what the bridge-deck and tunnel corrections did
        (`elevationCorrections`: status, counts); a correction that failed on a tile
        read or left a detected deck on the valley floor is also a line of `warnings`,
        prefixed with its track.'
      parameters:
      - name: kinds
        in: query
        description: 'Which containers to read: `all` (`<trk>` and `<rte>`), `tracks`
          (`<trk>` only), `routes` (`<rte>` only). Default `all`.'
        schema:
          type: string
          default: all
          enum:
          - all
          - tracks
          - routes
      - name: split
        in: query
        description: '`tracks`: one path per `<trk>` / `<rte>`, segments concatenated
          (the gap between two segments counts as distance). `segments`: one path
          per `<trkseg>`. Default `tracks`.'
        schema:
          type: string
          default: tracks
          enum:
          - tracks
          - segments
      - name: trackIndex
        in: query
        description: 'Keep only the path at this index of the selection (after `kinds`
          and `split`, empty paths dropped). Absent: every path. Out of range: 422
          `track-index-out-of-range`.'
        schema:
          type: integer
          minimum: 0.0
      - name: repair
        in: query
        description: When the XML does not parse, repair it (BOM, control characters,
          bare `&`, split surrogate references) and parse again; each repair is reported
          in `warnings`. Default `true`.
        schema:
          type: boolean
          default: true
      - name: format
        in: query
        description: 'Response format; wins over `Accept`. `summary` (`Accept: application/json`):
          a JSON summary per path; `gpx` (`Accept: application/gpx+xml`): a GPX 1.1
          document, one `<trk>` per path (`output.gpx`); `fit` (`Accept: application/vnd.ant.fit`):
          a FIT course, one lap per path (`output.fit`, `startTimeEpochMs` required);
          `csv` (`Accept: text/csv`): one row per point of the single path (`output.csv`);
          `json` (`Accept: application/vnd.vcyclist.columns+json`): the column document
          of the single path, one array per field (`output.json`). Absent: from `Accept`,
          then `summary`. An `Accept` naming none of these is 406. `csv` and `json`
          carry one path: with several, 422 `multiple-tracks` (use `trackIndex`).'
        schema:
          type: string
          default: summary
          enum:
          - summary
          - gpx
          - fit
          - csv
          - json
      - name: points
        in: query
        description: Include every point of each enhanced path (`format=summary` only).
          Default `false`.
        schema:
          type: boolean
          default: false
      requestBody:
        description: The GPX, as a multipart upload (part `gpx`) or as the raw body.
          Options travel in the multipart part `request`; a raw body takes every default.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - gpx
              properties:
                gpx:
                  type: string
                  description: The GPX document
                  format: binary
                request:
                  $ref: "#/components/schemas/EnhanceRequest"
            encoding:
              gpx:
                contentType: application/gpx+xml
              request:
                contentType: application/json
          application/gpx+xml:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: string
              format: binary
          text/xml:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: 'The rendered result. Files (gpx, fit, csv, json) come with
            `Content-Disposition: attachment`.'
          headers:
            Content-Disposition:
              description: '`attachment; filename="<name>.<ext>"` for a file format;
                absent for `summary`.'
              required: false
              deprecated: false
              schema:
                type: string
          content:
            application/gpx+xml:
              schema:
                type: string
            application/vnd.ant.fit:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                description: '`summary` (the default) or `json` (the column document)'
                oneOf:
                - $ref: "#/components/schemas/EnhanceResponse"
                - type: object
                  description: 'Column document (`format=json`): `fields` maps each
                    selected field''s `prop` to one array of numbers (null where absent),
                    and `meta` carries aggregates and units unless `output.json.includeMeta`
                    is false.'
        "400":
          description: 'Problem: `urn:vcyclist:problem:invalid-body`, `urn:vcyclist:problem:unknown-key`,
            `urn:vcyclist:problem:invalid-option`, `urn:vcyclist:problem:invalid-gpx`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "406":
          description: 'Problem: `urn:vcyclist:problem:not-acceptable`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: 'Problem: `urn:vcyclist:problem:payload-too-large`, `urn:vcyclist:problem:too-many-points`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: 'Problem: `urn:vcyclist:problem:unsupported-media-type`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 'Problem: `urn:vcyclist:problem:empty-gpx`, `urn:vcyclist:problem:track-index-out-of-range`,
            `urn:vcyclist:problem:multiple-tracks`, `urn:vcyclist:problem:missing-start-time`,
            `urn:vcyclist:problem:track-names-mismatch`, `urn:vcyclist:problem:not-encodable`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: 'Problem: `urn:vcyclist:problem:dem-unavailable`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 'Problem: `urn:vcyclist:problem:timeout`, `urn:vcyclist:problem:dem-rate-limited`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/defaults:
    get:
      operationId: getDefaults
      tags:
      - meta
      summary: Defaults this door applies
      description: 'The value every absent option takes, in the request shapes themselves:
        any member can be sent back as is and gives the same computation. Read from
        the engine, never restated. `demZoom` is null: each DEM source uses its own
        default zoom. `gpx.trackName` is the name `/enhance` gives; `/export` keeps
        the input''s names. `fit.startTimeEpochMs` has no default: it is required.
        `climb` is what `/analysis/climbs` applies, `elevation` what the `/elevation`
        operations apply; their zoom level is each source''s own (`GET /api/v1/elevation/sources`).
        `map` is what the `/map` operations apply when no framing is given. `limits`
        are this server''s.'
      responses:
        "200":
          description: The defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Defaults"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/export:
    post:
      operationId: export
      tags:
      - export
      summary: Convert a GPX
      description: Writes the selected paths of a GPX as GPX, FIT, CSV or column JSON,
        as they are in the file — no densification, no DEM, no simulation. GPX output
        keeps the input's track names and waypoints unless `output.gpx` says otherwise.
        Format from `format`, else `Accept`, else `gpx`.
      parameters:
      - name: kinds
        in: query
        description: 'Which containers to read: `all` (`<trk>` and `<rte>`), `tracks`
          (`<trk>` only), `routes` (`<rte>` only). Default `all`.'
        schema:
          type: string
          default: all
          enum:
          - all
          - tracks
          - routes
      - name: split
        in: query
        description: '`tracks`: one path per `<trk>` / `<rte>`, segments concatenated
          (the gap between two segments counts as distance). `segments`: one path
          per `<trkseg>`. Default `tracks`.'
        schema:
          type: string
          default: tracks
          enum:
          - tracks
          - segments
      - name: trackIndex
        in: query
        description: 'Keep only the path at this index of the selection (after `kinds`
          and `split`, empty paths dropped). Absent: every path. Out of range: 422
          `track-index-out-of-range`.'
        schema:
          type: integer
          minimum: 0.0
      - name: repair
        in: query
        description: When the XML does not parse, repair it (BOM, control characters,
          bare `&`, split surrogate references) and parse again; each repair is reported
          in `warnings`. Default `true`.
        schema:
          type: boolean
          default: true
      - name: format
        in: query
        description: 'Response format; wins over `Accept`. `gpx` (`Accept: application/gpx+xml`):
          a GPX 1.1 document, one `<trk>` per path (`output.gpx`); `fit` (`Accept:
          application/vnd.ant.fit`): a FIT course, one lap per path (`output.fit`,
          `startTimeEpochMs` required); `csv` (`Accept: text/csv`): one row per point
          of the single path (`output.csv`); `json` (`Accept: application/vnd.vcyclist.columns+json`):
          the column document of the single path, one array per field (`output.json`).
          Absent: from `Accept`, then `gpx`. An `Accept` naming none of these is 406.
          `csv` and `json` carry one path: with several, 422 `multiple-tracks` (use
          `trackIndex`).'
        schema:
          type: string
          default: gpx
          enum:
          - gpx
          - fit
          - csv
          - json
      requestBody:
        description: The GPX, as a multipart upload (part `gpx`) or as the raw body.
          Options travel in the multipart part `request`; a raw body takes every default.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - gpx
              properties:
                gpx:
                  type: string
                  description: The GPX document
                  format: binary
                request:
                  $ref: "#/components/schemas/ExportRequest"
            encoding:
              gpx:
                contentType: application/gpx+xml
              request:
                contentType: application/json
          application/gpx+xml:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: string
              format: binary
          text/xml:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: 'The rendered result. Files (gpx, fit, csv, json) come with
            `Content-Disposition: attachment`.'
          headers:
            Content-Disposition:
              description: '`attachment; filename="<name>.<ext>"` for a file format;
                absent for `summary`.'
              required: false
              deprecated: false
              schema:
                type: string
          content:
            application/gpx+xml:
              schema:
                type: string
            application/vnd.ant.fit:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                description: 'Column document (`format=json`): `fields` maps each
                  selected field''s `prop` to one array of numbers (null where absent),
                  and `meta` carries aggregates and units unless `output.json.includeMeta`
                  is false.'
        "400":
          description: 'Problem: `urn:vcyclist:problem:invalid-body`, `urn:vcyclist:problem:unknown-key`,
            `urn:vcyclist:problem:invalid-option`, `urn:vcyclist:problem:invalid-gpx`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "406":
          description: 'Problem: `urn:vcyclist:problem:not-acceptable`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: 'Problem: `urn:vcyclist:problem:payload-too-large`, `urn:vcyclist:problem:too-many-points`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: 'Problem: `urn:vcyclist:problem:unsupported-media-type`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 'Problem: `urn:vcyclist:problem:empty-gpx`, `urn:vcyclist:problem:track-index-out-of-range`,
            `urn:vcyclist:problem:multiple-tracks`, `urn:vcyclist:problem:missing-start-time`,
            `urn:vcyclist:problem:track-names-mismatch`, `urn:vcyclist:problem:not-encodable`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 'Problem: `urn:vcyclist:problem:timeout`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analysis/climbs:
    post:
      operationId: detectClimbs
      tags:
      - analysis
      summary: Detect the climbs of a GPX
      description: Finds the climbs of each selected path from its own elevations,
        and splits each into homogeneous-grade parts. Grades are ratios (`0.08` is
        8 %); distances are absolute along the path. Every absent option takes the
        default published by `GET /api/v1/defaults` (`climb`).
      parameters:
      - name: kinds
        in: query
        description: 'Which containers to read: `all` (`<trk>` and `<rte>`), `tracks`
          (`<trk>` only), `routes` (`<rte>` only). Default `all`.'
        schema:
          type: string
          default: all
          enum:
          - all
          - tracks
          - routes
      - name: split
        in: query
        description: '`tracks`: one path per `<trk>` / `<rte>`, segments concatenated
          (the gap between two segments counts as distance). `segments`: one path
          per `<trkseg>`. Default `tracks`.'
        schema:
          type: string
          default: tracks
          enum:
          - tracks
          - segments
      - name: trackIndex
        in: query
        description: 'Keep only the path at this index of the selection (after `kinds`
          and `split`, empty paths dropped). Absent: every path. Out of range: 422
          `track-index-out-of-range`.'
        schema:
          type: integer
          minimum: 0.0
      - name: repair
        in: query
        description: When the XML does not parse, repair it (BOM, control characters,
          bare `&`, split surrogate references) and parse again; each repair is reported
          in `warnings`. Default `true`.
        schema:
          type: boolean
          default: true
      requestBody:
        description: The GPX, as a multipart upload (part `gpx`) or as the raw body.
          Options travel in the multipart part `request`; a raw body takes every default.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - gpx
              properties:
                gpx:
                  type: string
                  description: The GPX document
                  format: binary
                request:
                  $ref: "#/components/schemas/ClimbRequest"
            encoding:
              gpx:
                contentType: application/gpx+xml
              request:
                contentType: application/json
          application/gpx+xml:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: string
              format: binary
          text/xml:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: The climbs of each path, in path order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimbsResponse"
        "400":
          description: 'Problem: `urn:vcyclist:problem:invalid-body`, `urn:vcyclist:problem:unknown-key`,
            `urn:vcyclist:problem:invalid-option`, `urn:vcyclist:problem:invalid-gpx`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: 'Problem: `urn:vcyclist:problem:payload-too-large`, `urn:vcyclist:problem:too-many-points`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: 'Problem: `urn:vcyclist:problem:unsupported-media-type`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 'Problem: `urn:vcyclist:problem:empty-gpx`, `urn:vcyclist:problem:track-index-out-of-range`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 'Problem: `urn:vcyclist:problem:timeout`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/analysis/racing-line:
    post:
      operationId: analyzeRacingLine
      tags:
      - analysis
      summary: Analyse the racing line of a GPX
      description: 'Reports what the racing line would do to each selected path —
        corners, corridor, curvature and the solved lateral offset — without moving
        any coordinate. Of the `options` object, only `racingLineEnabled`, `racingLineCorridor`
        and `racingLineRoadWidthM` are read; any other key is 400 `invalid-option`,
        and so is `racingLineEnabled: false`. A path too short or degenerate to analyse
        gets `null`. Per-station values that were not computed are `null`.'
      parameters:
      - name: kinds
        in: query
        description: 'Which containers to read: `all` (`<trk>` and `<rte>`), `tracks`
          (`<trk>` only), `routes` (`<rte>` only). Default `all`.'
        schema:
          type: string
          default: all
          enum:
          - all
          - tracks
          - routes
      - name: split
        in: query
        description: '`tracks`: one path per `<trk>` / `<rte>`, segments concatenated
          (the gap between two segments counts as distance). `segments`: one path
          per `<trkseg>`. Default `tracks`.'
        schema:
