          type: string
          default: all
          enum:
          - all
          - tracks
          - routes
      - name: split
        in: query
        description: '`tracks`: one path per `<trk>` / `<rte>`, segments concatenated
          (the gap between two segments counts as distance). `segments`: one path
          per `<trkseg>`. Default `tracks`.'
        schema:
          type: string
          default: tracks
          enum:
          - tracks
          - segments
      - name: trackIndex
        in: query
        description: 'Keep only the path at this index of the selection (after `kinds`
          and `split`, empty paths dropped). Absent: every path. Out of range: 422
          `track-index-out-of-range`.'
