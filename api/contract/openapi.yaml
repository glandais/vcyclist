        tunnels:
          type: string
          description: What the tunnel step did, one of `GET /api/v1/catalog` `elevationCorrectionStatuses`.
        tunnelsApplied:
          type: integer
          description: Tunnels flattened between their portals.
        tunnelsDropped:
          type: integer
          description: Tunnels refused because a bridge deck lies between their portals.
        tunnelsOutOfScope:
