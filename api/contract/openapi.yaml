      summary: Render the tracks over map tiles
      description: 'Draws the selected paths over raster tiles of **this server''s**
        tile source (`VCYCLIST_API_MAP_TILE_URL`); a request never names one. Without
        it the operation is 503 `map-tiles-unconfigured`. Framing: at most one of
        `maxSize`, `width`+`height` or `zoom`; none frames by the published `maxSize`
        (`GET /api/v1/defaults` `map`). Any dimension is bounded by `limits.maxMapPixels`.
