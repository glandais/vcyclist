components:
  schemas:
    Health:
      type: object
      title: Health
      required:
      - status
      properties:
        status:
          type: string
    FieldError:
      type: object
      title: FieldError
      required:
      - pointer
      - message
      properties:
        pointer:
          type: string
        message:
          type: string
    Problem:
      type: object
      title: Problem
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
        unknownKeys:
          type:
          - array
          - "null"
          items:
            type: string
        errors:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/FieldError"
    Version:
      type: object
      title: Version
      required:
      - apiVersion
      - engineVersion
      properties:
        apiVersion:
          type: string
        engineVersion:
          type: string
    Catalog:
      type: object
      title: Catalog
      required:
      - powerModels
      - roadConditions
      - corridorModes
      - elevationGainPresets
      - gpxPowerSources
      - elevationSources
      - cornerKinds
      - elevationCorrectionStatuses
      - tunnelScopes
      - outputFormats
      properties:
        powerModels:
          type: array
          items:
            type: string
        roadConditions:
          type: array
          items:
            type: string
        corridorModes:
          type: array
          items:
            type: string
        elevationGainPresets:
          type: array
          items:
            type: string
        gpxPowerSources:
          type: array
          items:
            type: string
        elevationSources:
