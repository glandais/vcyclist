openapi: 3.1.1
info:
  title: vcyclist API
  version: 1.0.0
  description: 'HTTP door of the vcyclist engine, a physics-based cycling simulator
    that turns GPS traces into physics-aware virtualized rides. Stateless: every request
    carries its own GPX. Errors are RFC 9457 `application/problem+json` documents.
    This document is generated from the server''s routing tree (`./gradlew :api:generateOpenApi`).'
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
      - meta
      summary: Liveness probe
      description: Answers `{"status":"UP"}` while the server accepts requests. Computes
        nothing.
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/version:
    get:
      operationId: getVersion
      tags:
      - meta
      summary: Contract and engine versions
      description: '`apiVersion` is the version of this contract, which changes only
        when the contract does; `engineVersion` is the version of the vcyclist engine
        the server was built with.'
      responses:
        "200":
          description: The versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/catalog:
    get:
      operationId: getCatalog
      tags:
      - meta
      summary: Wire values of every enumeration
      description: The accepted spellings of every enumerated option — power models,
        road conditions, racing-line corridors, elevation-gain presets, GPX power
        sources, DEM sources — and the corner kinds and output formats the API emits.
        Read from the engine, never restated.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/fields:
    get:
      operationId: listFields
      tags:
      - meta
      summary: Per-point fields of a track
      description: Every per-point field a track carries, in ordinal order, with its
        unit and category. `prop` is the name the CSV and JSON-columns exports accept
        in their `fields` option.
      responses:
        "200":
          description: The field definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldDefinition"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/gpx/parse:
    post:
      operationId: parseGpx
      tags:
      - gpx
      summary: Parse a GPX
      description: 'Reads a GPX document and returns its waypoints and, for each selected
        path, its name, its container and its statistics — optionally every point.
        Simulates nothing: distances and elevations are those of the file.'
      parameters:
      - name: kinds
        in: query
        description: 'Which containers to read: `all` (`<trk>` and `<rte>`), `tracks`
          (`<trk>` only), `routes` (`<rte>` only). Default `all`.'
        schema:
          type: string
          default: all
          enum:
          - all
          - tracks
          - routes
      - name: split
        in: query
        description: '`tracks`: one path per `<trk>` / `<rte>`, segments concatenated
          (the gap between two segments counts as distance). `segments`: one path
          per `<trkseg>`. Default `tracks`.'
        schema:
          type: string
          default: tracks
          enum:
          - tracks
          - segments
      - name: trackIndex
        in: query
        description: 'Keep only the path at this index of the selection (after `kinds`
          and `split`, empty paths dropped). Absent: every path. Out of range: 422
          `track-index-out-of-range`.'
        schema:
          type: integer
          minimum: 0.0
      - name: repair
        in: query
        description: When the XML does not parse, repair it (BOM, control characters,
          bare `&`, split surrogate references) and parse again; each repair is reported
          in `warnings`. Default `true`.
        schema:
          type: boolean
          default: true
      - name: points
        in: query
        description: Include every point of each path. Default `false`.
        schema:
          type: boolean
          default: false
      requestBody:
        description: The GPX, as a multipart upload (part `gpx`) or as the raw body.
          This operation takes no `request` part.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - gpx
              properties:
                gpx:
                  type: string
                  description: The GPX document
                  format: binary
            encoding:
              gpx:
                contentType: application/gpx+xml
          application/gpx+xml:
            schema:
              type: string
              format: binary
          application/xml:
            schema:
              type: string
              format: binary
          text/xml:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: The parsed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedGpx"
        "400":
          description: 'Problem: `urn:vcyclist:problem:invalid-body`, `urn:vcyclist:problem:unknown-key`,
            `urn:vcyclist:problem:invalid-option`, `urn:vcyclist:problem:invalid-gpx`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: 'Problem: `urn:vcyclist:problem:payload-too-large`, `urn:vcyclist:problem:too-many-points`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: 'Problem: `urn:vcyclist:problem:unsupported-media-type`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 'Problem: `urn:vcyclist:problem:empty-gpx`, `urn:vcyclist:problem:track-index-out-of-range`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 'Problem: `urn:vcyclist:problem:timeout`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
components:
  schemas:
    Health:
      type: object
      title: Health
      required:
      - status
      properties:
        status:
          type: string
    FieldError:
      type: object
      title: FieldError
      required:
      - pointer
      - message
      properties:
        pointer:
          type: string
        message:
          type: string
    Problem:
      type: object
      title: Problem
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
        unknownKeys:
          type:
          - array
          - "null"
          items:
            type: string
        errors:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/FieldError"
    Version:
      type: object
      title: Version
      required:
      - apiVersion
      - engineVersion
      properties:
        apiVersion:
          type: string
        engineVersion:
          type: string
    Catalog:
      type: object
      title: Catalog
      required:
      - powerModels
      - roadConditions
      - corridorModes
      - elevationGainPresets
      - gpxPowerSources
      - elevationSources
      - cornerKinds
      - outputFormats
      properties:
        powerModels:
          type: array
          items:
            type: string
        roadConditions:
          type: array
          items:
            type: string
        corridorModes:
          type: array
          items:
            type: string
        elevationGainPresets:
          type: array
          items:
            type: string
        gpxPowerSources:
          type: array
          items:
            type: string
        elevationSources:
          type: array
          items:
            type: string
        cornerKinds:
          type: array
          items:
            type: string
        outputFormats:
          type: array
          items:
            type: string
    FieldDefinition:
      type: object
      title: FieldDefinition
      required:
      - index
      - prop
      - unit
      - shortDescription
      - categoryId
      - categoryName
      - notSelectable
      - anglesInRadians
      properties:
        index:
          type: integer
        prop:
          type: string
        unit:
          type: string
        shortDescription:
          type: string
        categoryId:
          type: string
        categoryName:
          type: string
        notSelectable:
          type: boolean
        anglesInRadians:
          type: boolean
    Waypoint:
      type: object
      title: Waypoint
      required:
      - latitudeDeg
      - longitudeDeg
      properties:
        latitudeDeg:
          type: number
        longitudeDeg:
          type: number
        elevationM:
          type:
          - number
          - "null"
        name:
          type:
          - string
          - "null"
        description:
          type:
          - string
          - "null"
        symbol:
          type:
          - string
          - "null"
        type:
          type:
          - string
          - "null"
        timeEpochMs:
          type:
          - integer
          - "null"
    Bounds:
      type:
      - object
      - "null"
      title: Bounds
      required:
      - minLatitude
      - minLongitude
      - maxLatitude
      - maxLongitude
      properties:
        minLatitude:
          type: number
        minLongitude:
          type: number
        maxLatitude:
          type: number
        maxLongitude:
          type: number
    PathSummary:
      type: object
      title: PathSummary
      required:
      - size
      - totalDistance
      - elevationGain
      - elevationLoss
      - reportedElevationGain
      - reportedElevationLoss
      properties:
        size:
          type: integer
        totalDistance:
          type: number
        durationMs:
          type:
          - number
          - "null"
        minElevation:
          type:
          - number
          - "null"
        maxElevation:
          type:
          - number
          - "null"
        elevationGain:
          type: number
        elevationLoss:
          type: number
        elevationGainFiltered:
          type:
          - number
          - "null"
        elevationLossFiltered:
          type:
          - number
          - "null"
        reportedElevationGain:
          type: number
        reportedElevationLoss:
          type: number
        bounds:
          $ref: "#/components/schemas/Bounds"
    Point:
      type: object
      title: Point
      properties:
        latitudeDeg:
          type:
          - number
          - "null"
        longitudeDeg:
          type:
          - number
          - "null"
        elevation:
          type:
          - number
          - "null"
        timeMs:
          type:
          - number
          - "null"
        speed:
          type:
          - number
          - "null"
        pComputedPower:
          type:
          - number
          - "null"
        distance:
          type:
          - number
          - "null"
        grade:
          type:
          - number
          - "null"
    ParsedPath:
      type: object
      title: ParsedPath
      required:
      - kind
      - summary
      properties:
        name:
          type:
          - string
          - "null"
        kind:
          type: string
        summary:
          $ref: "#/components/schemas/PathSummary"
        points:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/Point"
    ParsedGpx:
      type: object
      title: ParsedGpx
      required:
      - name
      - waypoints
      - paths
      - warnings
      properties:
        name:
          type: string
        startTimeEpochMs:
          type:
          - integer
          - "null"
        waypoints:
          type: array
          items:
            $ref: "#/components/schemas/Waypoint"
        paths:
          type: array
          items:
            $ref: "#/components/schemas/ParsedPath"
        warnings:
          type: array
          items:
            type: string