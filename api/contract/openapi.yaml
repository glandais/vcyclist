    EnhanceOptions:
      type:
      - object
      - "null"
      title: EnhanceOptions
      properties:
        fixElevation:
          type:
          - boolean
          - "null"
          description: 'Replace elevations with the DEM''s. Absent or null: the default
            published by `GET /api/v1/defaults`.'
        computeMaxSpeeds:
          type:
          - boolean
          - "null"
          description: 'Compute cornering and braking speed limits. Absent or null:
            the default published by `GET /api/v1/defaults`.'
        virtualizeTrack:
          type:
          - boolean
          - "null"
          description: 'Run the time-stepping simulation. Absent or null: the default
            published by `GET /api/v1/defaults`.'
        computeOnePointPerSecond:
          type:
          - boolean
          - "null"
          description: 'Resample the result to one point per second. Absent or null:
            the default published by `GET /api/v1/defaults`.'
        simplifyEnabled:
          type:
          - boolean
          - "null"
          description: 'Simplify the result (Douglas-Peucker 3D). Absent or null:
            the default published by `GET /api/v1/defaults`.'
        simplifyToleranceM:
          type:
          - number
          - "null"
          description: 'Simplification tolerance, metres. Absent or null: the default
            published by `GET /api/v1/defaults`.'
        simplifyZExaggeration:
          type:
          - number
          - "null"
          description: 'Elevation exaggeration of the simplification. Absent or null:
            the default published by `GET /api/v1/defaults`.'
        wPrimeBalanceEnabled:
          type:
          - boolean
          - "null"
          description: 'Annotate W'' balance. Absent or null: the default published
            by `GET /api/v1/defaults`.'
        wPrimeBalanceCriticalPower:
          type:
          - number
          - "null"
          description: 'Critical power of the W'' balance, watts. Absent or null:
            the default published by `GET /api/v1/defaults`.'
        wPrimeBalanceWPrime:
          type:
          - number
          - "null"
          description: 'W'' of the W'' balance, joules. Absent or null: the default
            published by `GET /api/v1/defaults`.'
        curvatureEnabled:
          type:
          - boolean
          - "null"
          description: 'Estimate the trajectory curvature. Absent or null: the default
            published by `GET /api/v1/defaults`.'
        racingLineEnabled:
          type:
          - boolean
          - "null"
          description: 'Ride the racing line (moves every coordinate). Absent or null:
            the default published by `GET /api/v1/defaults`.'
        racingLineCorridor:
          type:
          - string
          - "null"
          description: 'Racing-line corridor, one of `GET /api/v1/catalog` `corridorModes`.
            Absent or null: the default published by `GET /api/v1/defaults`.'
        racingLineRoadWidthM:
          type:
          - number
          - "null"
          description: 'Road width where the GPX gives none, metres. Absent or null:
            the default published by `GET /api/v1/defaults`.'
        elevationGainPreset:
          type:
          - string
          - "null"
          description: 'Elevation-gain preset, one of `GET /api/v1/catalog` `elevationGainPresets`.
            Naming one takes its own threshold and smoothing window. Absent or null:
            the default published by `GET /api/v1/defaults`.'
        elevationGainThresholdM:
          type:
          - number
          - "null"
          description: 'Elevation-gain dead band, metres; wins over the preset''s.
            Absent or null: the default published by `GET /api/v1/defaults`.'
        elevationGainEnabled:
          type:
          - boolean
          - "null"
          description: 'Compute the filtered elevation gain. Absent or null: the default
            published by `GET /api/v1/defaults`.'
        elevationSmoothWindowM:
          type:
          - number
          - "null"
          description: 'Half-width of the elevation smoothing kernel, metres. Absent
            or null: the default published by `GET /api/v1/defaults`.'
        bridgeDecksEnabled:
          type:
          - boolean
          - "null"
          description: 'Allow the bridge-deck correction after `fixElevation`: ride
            each deck IGN''s surface model shows instead of the valley floor under
            it. A permission: it runs only with `demSource` `ign-lidar-hd` at its
            default zoom, and the track''s `elevationCorrections.bridgeDecks` says
            `unavailable` otherwise. `false` saves the surface-model fetches. Absent
            or null: the default published by `GET /api/v1/defaults`.'
        tunnelsEnabled:
          type:
          - boolean
          - "null"
          description: 'Allow the tunnel correction after `fixElevation`, on any DEM:
            flatten each detected tunnel between its portals. Turn it off on trails
            with steep real knolls, or where only GLO-30 covers the route — its precision
            is unmeasured there. Absent or null: the default published by `GET /api/v1/defaults`.'
        tunnelScope:
          type:
          - string
          - "null"
          description: 'Where the tunnel correction may flatten what it detects, one
            of `GET /api/v1/catalog` `tunnelScopes`: `measured-terrain` (IGN LiDAR
            HD, and Mapterhorn in France, where its precision was measured) or `everywhere`.
            A tunnel left out is counted in `elevationCorrections.tunnelsOutOfScope`.
            Absent or null: the default published by `GET /api/v1/defaults`.'
        demZoom:
          type:
          - integer
          - "null"
          description: 'DEM zoom level, 0..15. Absent or null: the DEM source''s own
            default zoom.'
        demSource:
          type:
          - string
          - "null"
          description: 'DEM source, one of `GET /api/v1/catalog` `elevationSources`.
            Absent or null: the default published by `GET /api/v1/defaults`.'
    Cyclist:
