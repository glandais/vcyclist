  /api/v1/elevation/point:
    get:
      operationId: getElevation
      tags:
      - elevation
      summary: DEM elevation of one point
      description: The elevation of one position, read from the DEM. Every absent
        parameter takes the default published by `GET /api/v1/defaults` (`elevation`);
        the zoom is the source's own.
      parameters:
      - name: lat
        in: query
        description: Latitude, degrees, within the Web Mercator band (about ±85.05).
        required: true
        schema:
          type: number
      - name: lon
        in: query
        description: Longitude, degrees, -180..180.
        required: true
        schema:
          type: number
      - name: source
        in: query
        description: DEM source, one of `GET /api/v1/catalog` `elevationSources`.
          Default `mapterhorn`.
        schema:
          type: string
          enum:
          - mapterhorn
          - ign-lidar-hd
      - name: zoomLevel
        in: query
        description: 'DEM zoom level, 0..15. Absent: the source''s own default zoom.'
        schema:
          type: integer
          maximum: 15.0
          minimum: 0.0
      - name: interpolation
        in: query
        description: Bilinear interpolation rather than nearest sample. Default `true`.
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: The elevation, with its attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationPointResponse"
        "400":
          description: 'Problem: `urn:vcyclist:problem:unknown-key`, `urn:vcyclist:problem:invalid-option`'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
