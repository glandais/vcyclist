name: check
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: 21, distribution: temurin }
      - uses: gradle/actions/setup-gradle@v6.3.0

      # `wasmWasiWasmtimeTest` (task w01) runs the WASI tests of :gpx, :elevation, :fit and
      # :engine inside wasmtime, which KGP downloads itself into `$GRADLE_USER_HOME/wasmtime/`
      # — 64 MB unpacked, version chosen by the Kotlin plugin, hence the key on
      # `libs.versions.toml`. Never install wasmtime from apt/brew or a third-party action: KGP
      # wants *its* version in *its* directory, and a divergent host version would flip the
      # GC/exnref proposals between local and CI.
      #
      # `setup-gradle` has no `cache-extra-paths`; its `gradle-home-cache-includes` would work
      # (the directory is inside Gradle User Home) but folds wasmtime into a key that does not
      # track the Kotlin version. A dedicated entry is both correctly keyed and legible in the
      # log, which is how w02 measured it: 16 MB compressed, restored in 2 s, against a download
      # KGP does itself in ~2.5 s. Near enough a wash, kept because a restore cannot be slower.
      #
      # Do not expect it on a fresh PR. Actions caches are scoped per ref and this workflow only
      # runs on `pull_request`, so nothing ever writes an entry on `develop`: a PR gets a hit
      # from its *second* run onwards. Adding a `push:` trigger on develop would fix that, at
      # the price of a full duplicate `check` per merge — not worth it for 2.5 s.
      - name: Cache the wasmtime runtime KGP provisions
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wasmtime
          key: wasmtime-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - run: ./gradlew check

      # `check` already covers the demo's lint and typecheck: `:demo` registers a `check` task, and an
      # unqualified task name runs in every project that has one. What it does *not* cover is the
      # production Vite build — that lives under `:demo:assemble`, and `:demo` deliberately has no
      # `build` task, so nothing on a PR ever runs it. Until this step, a change that linted and
      # typechecked cleanly but broke `vite build` merged green and only failed later, in the gh-pages
      # deploy, where the signal is a red deployment rather than a red review.
      #
      # Cheap here because `check` has already done `npmInstall`: what is left is the engine's library
      # distribution plus Vite itself (2.6 s locally). Kept a separate step so the log says which half
      # broke, and left out of `:demo`'s Gradle wiring on purpose — putting it in `build` would make
      # every contributor pay npm install and Vite on an ordinary local build, and would make
      # `clean build` need the network.
      - name: Build the demo the way gh-pages will
        run: ./gradlew :demo:npmBuild

      # Link the standalone WASI module and weigh it (task w06). Not part of `check` — packaging
      # is not verification — but worth doing on every PR: a size regression is caused by what
      # the exports reach, so it appears the moment someone widens the reachable graph, and it is
      # much cheaper to see here than in a release.
      - name: Build and weigh the standalone .wasm
        run: ./gradlew :engine:checkWasmModuleSize

      # The only end-to-end exercise of the WASI ABI: KGP's own test runner cannot supply the
      # custom `vcyclist` imports, so it never reaches an export that uses one. Renaming an
      # export, changing an error code or breaking the callback protocol turns this red — nothing
      # else does. Offline; the DEM tests stay behind INTEGRATION=1 like the rest of the project.
      - name: Run the WASI reference host
        run: |
          python3 -m pip install --quiet --requirement tools/wasi/requirements.txt
          ./tools/wasi/run-all.sh

      # A red wasmWasi test prints only the assertion in the log; the HTML report carries the
      # stack. `wasmWasiWasmtimeTest` is a `KotlinJsTest`, so its report lands in the same place
      # as every other target's and one pattern covers them all.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/**'
          retention-days: 7

      # Smoke the packaged CLI. It is the only consumer that crosses every module at once
      # (:gpx -> :engine -> :fit -> :map), so it doubles as an integration test — and a fat jar
      # that builds but cannot run (missing Main-Class, missing dependencies) is the classic
      # failure this catches.
      - name: Smoke the executable CLI jar
        run: |
          set -euo pipefail
          ./gradlew :cli:executableJar
          JAR=$(ls cli/build/libs/*-all.jar)
          java -jar "$JAR" --help
          java -jar "$JAR" --version
          # Run from another directory to prove the jar is self-contained.
          mkdir -p "$RUNNER_TEMP/clismoke" && cd "$RUNNER_TEMP/clismoke"
          java -jar "$GITHUB_WORKSPACE/$JAR" enhance \
            "$GITHUB_WORKSPACE/demo/public/gpx/stelvio.gpx" \
            --gpx out.gpx --csv out.csv --json out.json \
            --fit out.fit --start-time 2026-08-01T08:00:00Z
          for f in out.gpx out.csv out.json out.fit; do
            test -s "$f" || { echo "CLI produced no $f"; exit 1; }
          done
          # The FIT header carries an ASCII ".FIT" marker at offset 8; a truncated or empty
          # encode would not.
          test "$(dd if=out.fit bs=1 skip=8 count=4 2>/dev/null)" = ".FIT" || {
            echo "out.fit is not a FIT file"; exit 1; }
          echo "CLI smoke OK"

