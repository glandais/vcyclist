name: release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write          # tag + push the release commit, create the GitHub Release
  issues: write            # comment on closed issues referenced by the release
  pull-requests: write     # comment on merged PRs included in the release (PR scope is
                           # distinct from `issues:` since GitHub Actions v2, 2022)
  id-token: write          # OIDC for npm publish (no NPM_TOKEN secret needed)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: actions/setup-node@v7
        with:
          node-version: 25
          registry-url: 'https://registry.npmjs.org/'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run full check (build + tests on all targets)
        # actions/setup-node (registry-url) writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`
        # into NPM_CONFIG_USERCONFIG. Kotlin's bundled yarn 1.x (:kotlinNpmInstall) fails hard
        # with "Failed to replace env in config: ${NODE_AUTH_TOKEN}" when the var is undefined.
        # `check` publishes nothing, so an empty token just lets yarn resolve the placeholder.
        # Do NOT hoist this to the job/publish level — it would override OIDC trusted publishing.
        env:
          NODE_AUTH_TOKEN: ''
        run: ./gradlew check

      - name: Install release tooling
        run: npm ci

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          echo "default-key $KEY_ID" >> ~/.gnupg/gpg.conf

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: npx semantic-release
