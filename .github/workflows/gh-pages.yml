name: gh-pages

on:
  push:
    branches: [develop]
    paths:
      # Everything whose JS reaches the deployed bundle. `fit/**` belongs here even though the demo
      # exposes no FIT feature: `@glandais/vcyclist-engine` embeds `vcyclist-fit.js` (the FIT façade
      # lives in `:engine` because `Path` handles cannot cross a bundle boundary), so a FIT-only
      # change alters what Pages serves. Without it the deploy simply never fires and the site keeps
      # serving the previous bundle — stale, with nothing red anywhere to say so.
      - 'demo/**'
      - 'engine/**'
      - 'gpx/**'
      - 'elevation/**'
      - 'fit/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build demo (gh-pages target)
        env:
          DEPLOY_TARGET: gh-pages
        run: ./gradlew :demo:assemble --no-daemon

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
