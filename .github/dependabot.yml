version: 2
updates:
  # Kotlin Multiplatform deps: libs.versions.toml + per-module build.gradle.kts
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx*"
      xmlutil:
        patterns:
          - "io.github.pdvrieze.xmlutil*"

  # GitHub Actions versions in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # npm dev tooling (semantic-release and its plugins) — root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
